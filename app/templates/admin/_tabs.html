{% macro tabs(active, season_id='') %}
<nav class="admin-tabs season-switch" aria-label="Admin sections">
  <a class="tag {% if active == 'overview' %}tag-active{% endif %}"
     href="{{ url_for('admin.dashboard') }}">Overview</a>
  <a class="tag {% if active == 'auction' %}tag-active{% endif %}"
     href="{{ url_for('admin.auction', season=season_id) }}">Auction</a>
  <a class="tag {% if active == 'scorer' %}tag-active{% endif %}"
     href="{{ url_for('matches.admin_scorer', season=season_id) }}">Scorer</a>
  <a class="tag {% if active == 'finances' %}tag-active{% endif %}"
     href="{{ url_for('admin.finances', season=season_id) }}">Finances</a>
  <a class="tag {% if active == 'wagers' %}tag-active{% endif %}"
     href="{{ url_for('wagers.admin') }}">Wagers</a>
  <a class="tag {% if active == 'link' %}tag-active{% endif %}"
     href="{{ url_for('auth.link_page') }}">Link</a>
  <a class="tag {% if active == 'changelog' %}tag-active{% endif %}"
     href="{{ url_for('admin.changelog') }}">Changelog</a>
</nav>
{% endmacro %}
