{% extends "base.html" %}
{% block title %}{{ doc.title }} — SCL{% endblock %}
{% block content %}
<div class="brand-band">
  <img class="band-mark" src="{{ url_for('viewer.branding_asset', relpath='scl/logo-only-dark-bg-square.JPG') }}" alt="SCL">
  <h1>{{ doc.title }}</h1>
  <p class="band-sub"><a href="{{ url_for('viewer.docs_index') }}" style="color:#fff">All documents</a>
    · <a href="{{ url_for('viewer.doc_pdf', slug=doc.slug) }}" style="color:#fff">Download PDF ↓</a></p>
</div>

<article class="card doc-body">
  {{ html | safe }}
</article>
{% endblock %}
