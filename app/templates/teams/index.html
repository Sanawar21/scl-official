{% extends "base.html" %}
{% block title %}Teams{% endblock %}
{% block content %}
<div class="page-head">
  <h1>Teams</h1>
</div>

{% if not teams %}
  <div class="card"><p class="muted">No teams yet.</p></div>
{% else %}
  <div class="grid">
    {% for t in teams %}
      <section class="card team-box">
        <h2><a href="{{ url_for('matches.team_detail', slug=t.slug) }}">{{ t.name }}</a></h2>
        <p class="muted small">{{ t.season_id }}</p>
      </section>
    {% endfor %}
  </div>
{% endif %}
{% endblock %}
